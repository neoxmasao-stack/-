name: Release Gate (Strict)

on:
  workflow_dispatch:

jobs:
  strict-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare strict config
        env:
          GOLIVE_ENV_B64: ${{ secrets.GOLIVE_ENV_B64 }}
        run: |
          if [ -f .golive.env ]; then
            echo "Using repository .golive.env"
          elif [ -n "${GOLIVE_ENV_B64}" ]; then
            echo "Using base64-encoded strict controls from secret GOLIVE_ENV_B64"
            printf '%s' "${GOLIVE_ENV_B64}" | base64 --decode > .golive.env
          else
            echo "::error::Missing strict go-live configuration. Add .golive.env to the repo or set secret GOLIVE_ENV_B64 (base64-encoded .golive.env)."
            exit 1
          fi

      - name: Run strict go-live gate
        run: make check-go-live

      - name: Upload strict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-go-live-report
          path: artifacts/go-live-report.md
