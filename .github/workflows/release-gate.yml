name: Release Gate (Strict)

on:
  workflow_dispatch:

jobs:
  strict-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare strict config
        env:
          GOLIVE_STRICT_ENV_B64: ${{ secrets.GOLIVE_STRICT_ENV_B64 }}
          GOLIVE_STRICT_ENV: ${{ vars.GOLIVE_STRICT_ENV }}
        run: |
          if [ -f .golive.env ]; then
            echo "Using repository .golive.env"
          elif [ -n "${GOLIVE_STRICT_ENV_B64:-}" ]; then
            echo "$GOLIVE_STRICT_ENV_B64" | base64 --decode > .golive.env
            echo "Created .golive.env from GOLIVE_STRICT_ENV_B64 secret."
          elif [ -n "${GOLIVE_STRICT_ENV:-}" ]; then
            printf '%s\n' "$GOLIVE_STRICT_ENV" > .golive.env
            echo "Created .golive.env from GOLIVE_STRICT_ENV repository variable."
          else
            echo "Missing strict gate controls."
            echo "Set either secrets.GOLIVE_STRICT_ENV_B64 (base64-encoded .golive.env) or vars.GOLIVE_STRICT_ENV (multiline .golive.env content)."
            exit 1
          fi

      - name: Run strict go-live gate
        run: make check-go-live

      - name: Upload strict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-go-live-report
          path: artifacts/go-live-report.md
