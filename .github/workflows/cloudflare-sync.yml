name: Cloudflare Sync

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Validate only (no deploy)"
        required: true
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cloudflare dry-run sync
        if: ${{ inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cloudflare_sync.sh --${{ inputs.environment }} --dry-run

      - name: Cloudflare deploy sync
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cloudflare_sync.sh --${{ inputs.environment }}
